<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Headline News 24×7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4298712782505661" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>
  :root{
    --ink:#0B1F3A; --ink-2:#122B52; --paper:#F6F4EC; --card:#FFFFFF;
    --amber:#E8A33D; --amber-deep:#C97F17; --red:#C0392B; --green:#1B7A4D;
    --charcoal:#1B1D22; --steel:#69707D; --line:#E4E0D4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--charcoal);font-family:'Segoe UI',sans-serif;}

  header{
    background:var(--ink);padding:16px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:100;
  }
  header a.brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
  header img{width:34px;height:34px;border-radius:8px;object-fit:cover;}
  header .t{color:#F1E9D8;font-family:'Oswald',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.03em;}
  header .back{color:var(--amber);font-size:13px;font-weight:700;text-decoration:none;}

  main{max-width:640px;margin:0 auto;padding:0 0 50px;}
  .hero-img{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--line);display:block;}
  .article-body{padding:20px 18px;}
  .tag{
    display:inline-block;font-family:'Oswald',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ink);
    padding:5px 12px;border-radius:999px;margin-bottom:14px;
  }
  h1{
    font-family:'Oswald',sans-serif;text-transform:none;letter-spacing:0;
    font-size:24px;line-height:1.3;color:var(--charcoal);margin:0 0 10px;font-weight:700;
  }
  .meta-row{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--steel);margin-bottom:20px;}
  .article-text{font-size:16px;line-height:1.85;color:var(--charcoal);}
  .article-text p{margin:0 0 16px;}

  .embed-card{
    margin:26px 0;padding:14px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;max-width:340px;
  }
  .embed-label{
    font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--steel);margin-bottom:10px;
  }
  .link-card{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--charcoal);
  }
  .link-card .dot{width:8px;height:8px;border-radius:50%;background:var(--amber-deep);flex:0 0 auto;}
  .link-card .domain{font-weight:700;font-size:13.5px;}
  .link-card .go{margin-left:auto;color:var(--ink);font-size:12px;font-weight:700;}

  .video-embed{margin:24px 0;border-radius:12px;overflow:hidden;background:#000;}
  .video-embed iframe, .video-embed video{width:100%;aspect-ratio:16/9;display:block;border:none;}

  .share-row{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;}
  .share-btn{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
    padding:9px 14px;border-radius:8px;border:1.5px solid var(--line);text-decoration:none;color:var(--charcoal);
  }
  .share-btn.whatsapp{border-color:#25d366;color:#128c47;}

  .loading, .error{text-align:center;padding:60px 20px;color:var(--steel);font-size:14px;}

  /* FOOTER STYLES */
  .footer-section{
    margin-top:40px;padding:30px 18px;border-top:2px solid var(--line);background:var(--card);
  }
  .footer-title{
    font-family:'Oswald',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;color:var(--ink);margin-bottom:16px;
  }
  .footer-links{
    display:flex;flex-direction:column;gap:10px;
  }
  .footer-link{
    display:inline-flex;align-items:center;gap:8px;padding:12px 14px;
    border-radius:8px;border:1.5px solid var(--line);
    text-decoration:none;color:var(--charcoal);font-weight:600;font-size:13px;
    transition:all .2s;text-align:center;justify-content:center;
  }
  .footer-link:active{transform:scale(.98);background:var(--paper);}
  .footer-link.whatsapp{border-color:#25d366;color:#128c47;}
  .footer-link.contact{border-color:var(--ink);color:var(--ink);}
  .footer-link.privacy{border-color:var(--amber);color:var(--amber-deep);}
  .footer-link.terms{border-color:var(--red);color:var(--red);}
  .footer-copyright{
    text-align:center;color:var(--steel);font-size:11px;margin-top:20px;padding-top:20px;
    border-top:1px solid var(--line);
  }

  /* TRENDING NEWS SECTION */
  .trending-section{
    margin-top:40px;padding:30px 18px;border-top:2px solid var(--line);
  }
  .trending-title{
    font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;color:var(--ink);margin-bottom:18px;
  }
  .trending-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
  }
  .trending-card{
    display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;
    border-radius:10px;border:1px solid var(--line);background:var(--card);overflow:hidden;
    transition:all .2s;cursor:pointer;
  }
  .trending-card:active{transform:scale(.98);}
  .trending-card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line);}
  .trending-card-text{padding:8px;flex:1;display:flex;flex-direction:column;}
  .trending-card-title{font-size:12px;font-weight:700;line-height:1.3;color:var(--charcoal);}
  .trending-card-meta{font-size:9px;color:var(--steel);margin-top:auto;padding-top:4px;}

  .trending-loading{text-align:center;padding:20px;color:var(--steel);font-size:13px;}

  .view-badge{
    display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--steel);background:var(--paper);padding:6px 12px;
    border-radius:6px;margin-bottom:10px;
  }
</style>

<style id="premium-overrides">
:root{--pbg:#040817;--p1:#09132a;--p2:#0e1c3c;--pred:#ff1734;--pblue:#1687ff;--pcyan:#00d9ff;--ptxt:#f7fbff;--pmuted:#93a7cb;--pline:#243c68}
html,body{background:radial-gradient(circle at 50% -20%,#163d7a 0,#071125 38%,#03050d 85%) !important;color:var(--ptxt)!important}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,transparent 0 45%,#ffffff04 50%,transparent 55%);z-index:-1}
header,.site-header{background:#040a18e8!important;backdrop-filter:blur(18px);border-bottom:1px solid #1d3560!important;box-shadow:0 14px 45px #0009!important}
a{color:inherit}
.card,.panel,.news-card,.story-card,.article,.container,.section,.box,.admin-card,.stats-card,.form-card,.table-wrap{background:linear-gradient(145deg,#101d3c,#070d20)!important;border-color:#294571!important;box-shadow:0 18px 50px #0008,inset 0 1px #fff1!important}
button,.btn{border-radius:10px!important}
footer{background:#02050d!important;border-top:1px solid #1d345c!important;color:#9db0d0!important}
input,textarea,select{background:#071329!important;color:#fff!important;border-color:#294571!important}
/* Article readability: dark premium background + high-contrast white text */
main#mainContent,.article-body,.trending-section,.footer-section{color:#f7fbff!important;}
.article-body h1,.article-body h2,.article-body h3,.article-body p,.article-text,.article-text p,.meta-row,.view-badge,.embed-label,.trending-title,.trending-card-title{color:#f7fbff!important;}
.article-body h1{font-weight:800!important;}
.article-text p{color:#f7fbff!important;}
.meta-row,.trending-card-meta,.loading,.error{color:#aebddd!important;}
.view-badge{background:#07142b!important;border:1px solid #294571!important;}
.link-card{color:#f7fbff!important;background:#0a1730!important;border-color:#294571!important;}
.trending-card{background:#0a1730!important;border-color:#294571!important;}

/* LIKE + COMMENT SYSTEM */
.engagement{margin-top:24px;padding:18px;border:1px solid #294571;border-radius:14px;background:linear-gradient(145deg,#0c1935,#071025);box-shadow:0 15px 35px #0007}
.engagement-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.like-btn{border:1px solid #ff3d55;background:#101d3a;color:#fff;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;transition:.2s}
.like-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px #ff173433}
.like-btn.liked{background:#ff1734;border-color:#ff7382}
.like-count{font-weight:800;color:#fff}
.comment-box{margin-top:18px;padding-top:16px;border-top:1px solid #294571}
.comment-box h3{margin:0 0 12px;color:#fff;font-size:16px}
.comment-form{display:grid;gap:9px}
.comment-form input,.comment-form textarea{width:100%;border:1px solid #294571;border-radius:9px;padding:11px;background:#071329;color:#fff;outline:none}
.comment-form textarea{min-height:90px;resize:vertical}
.comment-form button{border:0;background:linear-gradient(135deg,#ff263c,#b90019);color:#fff;padding:11px 16px;border-radius:9px;font-weight:900;cursor:pointer}
.comments-list{margin-top:15px;display:grid;gap:9px}
.comment{padding:12px;border:1px solid #243c68;border-radius:10px;background:#08152e}
.comment strong{color:#fff;font-size:13px}.comment p{color:#c9d5ea;margin:5px 0 0;font-size:13px;line-height:1.5;white-space:pre-wrap}.comment small{color:#7f94b8;font-size:10px}
.comment-empty{color:#8fa4c7;font-size:12px}
.auth-note{color:#8fa4c7;font-size:10px;margin-top:7px}

</style>
</head>
<body>

  <header>
    <a class="brand" href="index.html">
      <img src="1000678471.png" alt="Headline News 24×7 logo">
      <div class="t">Headline News 24×7</div>
    </a>
    <a class="back" href="index.html">← Home</a>
  </header>

  <main id="mainContent">
    <div class="loading">Loading article...</div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAOTuJcjYGPld5wZYVPHK0jpXKAh561lVU",
      authDomain: "news-akkshu.firebaseapp.com",
      projectId: "news-akkshu",
      storageBucket: "news-akkshu.firebasestorage.app",
      messagingSenderId: "735024392453",
      appId: "1:735024392453:web:30f8a1f0832ff36b1fef6c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let currentUser = null;
    let articleIdForEngagement = null;
    let likeUnsubscribe = null;
    let commentsUnsubscribe = null;

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function paragraphize(text) {
      return (text || '')
        .split(/\n+/)
        .filter(p => p.trim())
        .map(p => `<p>${escapeHtml(p)}</p>`);
    }

    // Builds a small embedded card for the externalLink — placed inside the article, not a redirect.
    function buildLinkEmbed(url) {
      let host = '';
      try { host = new URL(url).hostname.replace('www.', ''); } catch (e) { host = url; }

      const isTwitter = /(^|\.)(twitter\.com|x\.com)$/.test(host);
      const isTweetStatus = isTwitter && /\/status\/\d+/.test(url);

      if (isTweetStatus) {
        // Official Twitter/X tweet embed — small card, loads via widgets.js
        return `
          <div class="embed-card">
            <div class="embed-label">From X / Twitter</div>
            <blockquote class="twitter-tweet" data-conversation="none" data-theme="light" data-dnt="true">
              <a href="${url}"></a>
            </blockquote>
          </div>`;
      }
      if (isTwitter) {
        // Profile link (not a specific tweet) — compact timeline embed
        return `
          <div class="embed-card">
            <div class="embed-label">On X / Twitter</div>
            <a class="twitter-timeline" data-height="260" data-theme="light" href="${url}">Tweets</a>
          </div>`;
      }
      // Any other external site — small clickable card, opens in a new tab only if user taps it
      return `
        <div class="embed-card">
          <div class="embed-label">Related Link</div>
          <a class="link-card" href="${url}" target="_blank" rel="noopener noreferrer">
            <span class="dot"></span>
            <span class="domain">${host}</span>
            <span class="go">Open ↗</span>
          </a>
        </div>`;
    }

    function buildVideoEmbed(url) {
      const yt = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
      if (yt) {
        return `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${yt[1]}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
      }
      return `<div class="video-embed"><video src="${url}" controls></video></div>`;
    }

    // Increment view count - called when article loads
    async function incrementViewCount(articleId) {
      try {
        await db.collection("allNews").doc(articleId).update({
          viewCount: firebase.firestore.FieldValue.increment(1)
        });
      } catch (e) {
        console.error('Error incrementing view count:', e);
      }
    }

    async function loadTrendingNews() {
      try {
        const trendingContainer = document.getElementById('trendingContainer');
        
        // Fetch 10 trending articles sorted by view count (most viewed first)
        const snap = await db.collection('allNews')
          .orderBy('viewCount', 'desc')
          .limit(10)
          .get();
        
        let trendingArticles = [];
        snap.forEach(doc => {
          trendingArticles.push({ id: doc.id, ...doc.data() });
        });

        if (!trendingArticles.length) {
          trendingContainer.innerHTML = '<div class="trending-loading">No trending articles available.</div>';
          return;
        }

        let html = '<div class="trending-grid">';
        trendingArticles.forEach(article => {
          const img = article.image || article.imageUrl || 'data:image/svg+xml;utf8,%3Csvg xmlns="http://www.w3.org/2000/svg" width="160" height="90"%3E%3Crect fill="%23E4E0D4"/%3E%3C/svg%3E';
          html += `
            <a class="trending-card" href="details.html?id=${article.id}">
              <img src="${img}" alt="" onerror="this.src='data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%2290%22%3E%3Crect fill=%22%23E4E0D4%22/%3E%3C/svg%3E'" loading="lazy">
              <div class="trending-card-text">
                <div class="trending-card-title">${escapeHtml(article.heading || '')}</div>
                <div class="trending-card-meta">👁 ${article.viewCount || 0} views</div>
              </div>
            </a>`;
        });
        html += '</div>';
        
        trendingContainer.innerHTML = html;
      } catch (e) {
        console.error('Error loading trending news:', e);
        document.getElementById('trendingContainer').innerHTML = '<div class="trending-loading">Could not load trending articles.</div>';
      }
    }


    async function ensureAnonymousAuth() {
      if (auth.currentUser) { currentUser = auth.currentUser; return currentUser; }
      const cred = await auth.signInAnonymously();
      currentUser = cred.user;
      return currentUser;
    }

    function formatCommentTime(ts) {
      try { return ts && ts.toDate ? ts.toDate().toLocaleString() : 'Just now'; } catch(e) { return 'Just now'; }
    }

    function renderComments(snapshot) {
      const box = document.getElementById('commentsList');
      const count = document.getElementById('commentCount');
      if (!box || !count) return;
      count.textContent = snapshot.size;
      if (snapshot.empty) { box.innerHTML = '<div class="comment-empty">Abhi koi comment nahi hai. Pehla comment aap karo! 👇</div>'; return; }
      box.innerHTML = snapshot.docs.map(doc => {
        const c = doc.data();
        return `<div class="comment"><strong>${escapeHtml(c.name || 'Reader')}</strong><small> • ${escapeHtml(formatCommentTime(c.timestamp))}</small><p>${escapeHtml(c.text || '')}</p></div>`;
      }).join('');
    }

    async function setupEngagement(articleId) {
      articleIdForEngagement = articleId;
      try { await ensureAnonymousAuth(); } catch(e) { console.error('Anonymous auth failed', e); }
      const likeRef = db.collection('allNews').doc(articleId).collection('likes');
      const commentsRef = db.collection('allNews').doc(articleId).collection('comments');

      if (likeUnsubscribe) likeUnsubscribe();
      likeUnsubscribe = likeRef.onSnapshot(snap => {
        const count = document.getElementById('likeCount');
        const btn = document.getElementById('likeBtn');
        if (count) count.textContent = snap.size;
        if (btn && currentUser) {
          const liked = snap.docs.some(d => d.id === currentUser.uid);
          btn.classList.toggle('liked', liked);
          btn.innerHTML = liked ? '❤️ Liked' : '🤍 Like';
        }
      }, err => console.error('Like listener error', err));

      if (commentsUnsubscribe) commentsUnsubscribe();
      commentsUnsubscribe = commentsRef.orderBy('timestamp','desc').limit(50).onSnapshot(renderComments, err => {
        console.error('Comments listener error', err);
        const box = document.getElementById('commentsList');
        if (box) box.innerHTML = '<div class="comment-empty">Comments load nahi ho pa rahe.</div>';
      });
    }

    async function toggleLike() {
      if (!articleIdForEngagement) return;
      try {
        const user = await ensureAnonymousAuth();
        const ref = db.collection('allNews').doc(articleIdForEngagement).collection('likes').doc(user.uid);
        const snap = await ref.get();
        if (snap.exists) await ref.delete();
        else await ref.set({ uid:user.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
      } catch(e) {
        console.error(e); alert('Like nahi ho paya. Please try again.');
      }
    }

    async function submitComment() {
      const nameEl = document.getElementById('commentName');
      const textEl = document.getElementById('commentText');
      const btn = document.getElementById('commentSubmit');
      const name = (nameEl.value || '').trim().slice(0,40) || 'Reader';
      const text = (textEl.value || '').trim().slice(0,1000);
      if (!text) { alert('Comment likho bhai 🙂'); return; }
      btn.disabled = true; btn.textContent = 'Posting...';
      try {
        const user = await ensureAnonymousAuth();
        await db.collection('allNews').doc(articleIdForEngagement).collection('comments').add({
          uid:user.uid, name:name, text:text, timestamp:firebase.firestore.FieldValue.serverTimestamp()
        });
        textEl.value = '';
      } catch(e) {
        console.error(e); alert('Comment post nahi ho paya. Please try again.');
      } finally { btn.disabled = false; btn.textContent = 'Comment Post Karein'; }
    }

    async function loadArticle() {
      const id = getParam('id');
      const main = document.getElementById('mainContent');
      if (!id) { main.innerHTML = `<div class="error">No article specified.</div>`; return; }

      try {
        const doc = await db.collection('allNews').doc(id).get();
        if (!doc.exists) { main.innerHTML = `<div class="error">This article could not be found.</div>`; return; }
        const d = doc.data();
        const section = d.section || 'News';
        const img = d.image || d.imageUrl || '';
        const viewCount = d.viewCount || 0;
        const paras = paragraphize(d.details);
        // Insert the link/tweet embed after the first paragraph so it sits inside the article, not up top.
        let bodyHtml = '';
        paras.forEach((p, i) => {
          bodyHtml += p;
          if (i === 0 && d.externalLink) bodyHtml += buildLinkEmbed(d.externalLink);
        });
        if (!paras.length && d.externalLink) bodyHtml += buildLinkEmbed(d.externalLink);
        if (d.videoUrl) bodyHtml += buildVideoEmbed(d.videoUrl);

        document.getElementById('pageTitle').textContent = (d.heading || 'Article') + ' | Headline News 24×7';

        main.innerHTML = `
          ${img ? `<img class="hero-img" src="${img}" alt="" onerror="this.style.display='none'">` : ''}
          <div class="article-body">
            <span class="tag">${section}</span>
            <h1>${escapeHtml(d.heading)}</h1>
            <div class="view-badge">👁 ${viewCount} views</div>
            <div class="meta-row">${d.timestamp && d.timestamp.toDate ? d.timestamp.toDate().toLocaleString() : ''}</div>
            <div class="article-text">${bodyHtml || '<p>Full details coming soon.</p>'}</div>
            <div class="share-row">
              <a class="share-btn whatsapp" href="https://wa.me/?text=${encodeURIComponent((d.heading || '') + ' ' + window.location.href)}" target="_blank" rel="noopener">Share on WhatsApp</a>
              <a class="share-btn" href="index.html">More News</a>
            </div>
            <div class="engagement">
              <div class="engagement-actions">
                <button id="likeBtn" class="like-btn" onclick="toggleLike()">🤍 Like</button>
                <span class="like-count">❤️ <span id="likeCount">0</span> Likes</span>
                <span class="like-count">💬 <span id="commentCount">0</span> Comments</span>
              </div>
              <div class="comment-box">
                <h3>💬 Comment Karein</h3>
                <div class="comment-form">
                  <input id="commentName" maxlength="40" placeholder="Aapka naam (optional)">
                  <textarea id="commentText" maxlength="1000" placeholder="Apna comment likhiye..."></textarea>
                  <button id="commentSubmit" onclick="submitComment()">Comment Post Karein</button>
                </div>
                <div class="auth-note">Aapka comment publicly dikh sakta hai. Password ki zarurat nahi hai.</div>
                <div id="commentsList" class="comments-list"><div class="comment-empty">Comments load ho rahe hain...</div></div>
              </div>
            </div>
          </div>
          <div class="trending-section">
            <div class="trending-title">🔥 Trending Now</div>
            <div id="trendingContainer" class="trending-loading">Loading...</div>
          </div>
          <div class="footer-section">
            <div class="footer-title">📞 Get In Touch</div>
            <div class="footer-links">
              <a class="footer-link contact" href="contact-us.html">
                📧 Contact Us
              </a>
              <a class="footer-link privacy" href="privacy-policy.html">
                🔒 Privacy Policy
              </a>
              <a class="footer-link terms" href="terms-and-conditions.html">
                ⚖️ Terms &amp; Conditions
              </a>
            </div>
            <div class="footer-copyright">
              © <span id="footerYear"></span> Headline News 24×7 — Deesa, Gujarat
            </div>
          </div>`;

        // Load Twitter widgets.js only if we actually embedded a tweet/timeline
        if (d.externalLink && /(^|\.)(twitter\.com|x\.com)$/.test((() => { try { return new URL(d.externalLink).hostname.replace('www.', ''); } catch (e) { return ''; } })())) {
          const s = document.createElement('script');
          s.src = 'https://platform.twitter.com/widgets.js';
          s.async = true;
          document.body.appendChild(s);
        }

        document.getElementById('footerYear').textContent = new Date().getFullYear();

        // Increment view count
        incrementViewCount(id);

        // Enable likes and comments for this article
        setupEngagement(id);

        // Load trending news after article loads
        loadTrendingNews();
      } catch (e) {
        main.innerHTML = `<div class="error">Could not load this article. Please try again.</div>`;
      }
    }

    loadArticle();
  </script>
</body>
</html>
